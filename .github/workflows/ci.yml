name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # The three models are about 265 MB together, so they are built once and cached.
      # The key changes whenever a pinned model or the export script does.
      - id: models
        uses: actions/cache@v6
        with:
          path: backend/models
          key: models-${{ hashFiles('backend/app/detection/model_store.py', 'backend/tools/export_models.py', 'backend/requirements-export.txt') }}
      # Converting the crack and streetlight models needs PyTorch. It goes in its own
      # virtualenv so the tests below run with only the app's requirements.
      - if: steps.models.outputs.cache-hit != 'true'
        run: |
          python -m venv /tmp/export
          /tmp/export/bin/pip install -r requirements-export.txt
          /tmp/export/bin/python -m tools.export_models
          python -m app.detection.model_store
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
