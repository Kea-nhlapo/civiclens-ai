[project]
name = "civiclens-ai-backend"
version = "2.0.0"
description = "FastAPI backend for CivicLens AI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "pydantic==2.14.4",
  "python-multipart==0.0.34",
  "Pillow==11.2.1",
  "numpy==2.5.5",
  "onnxruntime==1.31.1",
  "httpx==0.28.1",
  "anyio==4.9.0",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
