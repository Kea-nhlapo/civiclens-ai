name: civiclens
description: Take a photo of a pothole, crack, dumping or a broken streetlight and get a report ready for the municipality.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  material_ui: ^1.1.0
  http_parser: ^4.0.2
  image_picker: ^1.1.2
  share_plus: ^13.3.1
  archive: ^4.7.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
